[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostread"
version = "1.2.1"
description = "Transparent, always on top PDF reader for Windows: read over your terminal or editor at any opacity"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Amrita Kadam" }]
keywords = [
    "pdf", "pdf-reader", "pdf-viewer", "document-viewer", "ebook",
    "transparent", "translucent", "transparency", "opacity", "overlay",
    "always-on-top", "click-through", "windows", "desktop", "tkinter",
    "pymupdf", "productivity", "reading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    "PyMuPDF>=1.23",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/Amrita0205/ghostreader"
Source = "https://github.com/Amrita0205/ghostreader"
Issues = "https://github.com/Amrita0205/ghostreader/issues"
Changelog = "https://github.com/Amrita0205/ghostreader/releases"

[project.scripts]
ghostread = "ghostread.cli:main"

[project.gui-scripts]
ghostread-gui = "ghostread.cli:main"

[tool.setuptools]
packages = ["ghostread"]
