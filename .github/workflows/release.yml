name: release

# Fires when you push a version tag:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Builds the standalone Windows exe, publishes the package to PyPI, and puts
# both on a GitHub release. Can also be run by hand from the Actions tab, in
# which case it builds and uploads the exe but skips PyPI.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release

jobs:
  windows-exe:
    name: Build GhostRead.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Sanity check before freezing
        run: python -m tests.test_core

      - name: Build
        run: pyinstaller packaging/ghostread.spec --noconfirm --clean

      - name: Check the exe actually starts
        run: |
          if (-not (Test-Path dist/GhostRead.exe)) { throw "no exe produced" }
          $size = (Get-Item dist/GhostRead.exe).Length / 1MB
          Write-Host ("built GhostRead.exe, {0:N1} MB" -f $size)

      - uses: actions/upload-artifact@v4
        with:
          name: GhostRead-windows-exe
          path: dist/GhostRead.exe

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write      # trusted publishing, no API token to store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Attach to the GitHub release
    runs-on: ubuntu-latest
    needs: [windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GhostRead-windows-exe

      - uses: softprops/action-gh-release@v2
        with:
          files: GhostRead.exe
          draft: false
          generate_release_notes: true
          body: |
            ## Install

            **Windows, no Python needed.** Download `GhostRead.exe` below and run it.
            SmartScreen will warn the first time because the binary is not code
            signed: click *More info* then *Run anyway*.

            **Anywhere else, or if you want the `ghostread` command:**

            ```
            pip install --upgrade ghostread
            ```

            ---

            `GhostRead.exe` bundles PyMuPDF, which is AGPL-3.0, so the binary as a
            whole is distributed under the AGPL. The complete corresponding source
            is this repository at the tagged commit. See
            [THIRD-PARTY-NOTICES.md](https://github.com/Amrita0205/ghostread/blob/main/THIRD-PARTY-NOTICES.md).
